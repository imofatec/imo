spring.data.mongodb.database=imo_test

logging.level.com.imo.backend=DEBUG
logging.level.io.restassured=DEBUG

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

jwt.public.key=classpath:test-public-key.pem
jwt.private.key=classpath:test-private-key.pem

server.error.include-message=always
server.error.include-binding-errors=always

client.url=http://localhost

exchange_name=test-exchange-mock
routing_key.confirm_email=test.email.confirm
routing_key.forget_password=test.password.forget
rabbitmq.exchange.forgetpassword=test-forgetpassword-exchange
rabbitmq.exchange.sendemail=test-sendemail-exchange
