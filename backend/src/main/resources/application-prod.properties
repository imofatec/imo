server.port=8080
spring.application.name=backend
jwt.public.key=file:app.pub
jwt.private.key=file:app.key
spring.config.import=optional:classpath:.env-prod.properties
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
# Envs
spring.data.mongodb.uri=${ATLAS_CLUSTER}
spring.data.mongodb.database=${CLUSTER_DATABASE}
client.url=${CLIENT_URL}
exchange_name=${EXCHANGE_NAME}
routing_key.forget_password=${ROUTING_KEY_FORGET_PASSWORD}
routing_key.confirm_email=${ROUTING_KEY_CONFIRMATION_EMAIL}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESS}
