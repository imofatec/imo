# ----------------------------------------------------------------
# Server
spring.application.name=imo-backend
server.port=${PORT:8080}
# ----------------------------------------------------------------
# Files
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB
# ----------------------------------------------------------------
# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ----------------------------------------------------------------
# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGO_DATABASE:imo}
# ----------------------------------------------------------------
# Frontend
client.url=${CLIENT_URL:http://localhost:5173}
# ----------------------------------------------------------------
# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_ADDRESS:amqp://localhost:5672}
exchange_name=${EXCHANGE_NAME:imo.events}
routing_key.forget_password=${ROUTING_KEY_FORGET_PASSWORD:imo.events.forget-password}
routing_key.confirm_email=${ROUTING_KEY_CONFIRMATION_EMAIL:imo.events.confirm-email}
# ----------------------------------------------------------------
# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:app.pub}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:app.key}
# ---------------------------------------------------------------
# Logging (altere em prod)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.imo=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.data.mongodb=${MONGO_LOGGING:DEBUG}
logging.level.org.springframework.amqp=${MONGO_LOGGING:DEBUG}
# ---------------------------------------------------------------
# Dev tools (desative em prod)
## Spring dev tools
spring.devtools.add-properties=true
## Docs
springdoc.api-docs.enabled=true
## Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
## Scalar
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/docs
