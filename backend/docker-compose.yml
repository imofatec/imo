services:
  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"   # UI Web (http://localhost:16686)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (opcional)
      - "14250:14250"   # Jaeger gRPC
      - "6831:6831/udp" # Jaeger Thrift UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
